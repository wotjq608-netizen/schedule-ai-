<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 대시보드 · 개인 AI 비서</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fc;color:#1c2540;font:16px system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:clamp(16px,4vw,42px)}h1,h2,p{margin:0}h1{font-size:clamp(29px,5vw,44px);letter-spacing:-.05em}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
p{color:#536079;margin-top:7px}a{color:#4338a7;font-weight:650;text-underline-offset:3px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
article,.panel{background:#fff;border:1px solid #e0e5f1;border-radius:16px;padding:16px;box-shadow:0 12px 32px #1a244a0a}
article span{display:block;color:#536079;font-size:14px}article strong{display:block;font-size:26px;color:#4338a7}
.audit-tools{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.audit-tools label{display:block;font-size:14px;margin-bottom:4px}
input,button{font:inherit;padding:7px 9px;border:1px solid #cdd5e9;border-radius:8px;background:white;color:#1c2540}
button{background:#4338a7;color:white;cursor:pointer;font-weight:650}.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:450px}th,td{text-align:left;border-bottom:1px solid #e0e5f1;padding:11px 8px}
th{background:#f2f2ff;color:#413482}td{overflow-wrap:anywhere}nav{display:flex;gap:12px;margin-top:15px}
.audit-views{margin:0 0 12px}.audit-views a{padding:8px 12px}.audit-views [aria-current]{background:#e8e6ff;border-radius:8px}
@media(max-width:640px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><main>
<header><div><h1>관리자 대시보드</h1><p>현재 접속 IP <code><!-- current-ip --></code></p></div><a href="/login">로그인 화면</a></header>
<section class="metrics" aria-label="이용 현황"><!-- metrics --></section>
<nav class="audit-views" aria-label="기록 종류"><a href="/admin" <!-- login-current -->>로그인 기록</a><a href="/admin?view=gps" <!-- gps-current -->>GPS 사용 기록</a></nav>
<section class="panel" aria-labelledby="audit-heading">
<div class="audit-tools">
<div><h2 id="audit-heading"><!-- title --></h2><p><!-- description --></p></div>
<form action="/admin" method="get"><input type="hidden" name="view" value="<!-- view -->"><label for="audit-search"><!-- search-label --></label><input id="audit-search" name="q" maxlength="80" value="<!-- query -->"><button type="submit">검색</button></form>
</div>
<div class="table-wrap"><table aria-label="<!-- title -->"><thead><tr><!-- columns --></tr></thead><tbody><!-- rows --></tbody></table></div>
<nav aria-label="기록 탐색"><!-- pages --></nav>
</section>
</main></body></html>
