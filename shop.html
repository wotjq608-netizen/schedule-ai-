<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 · 개인 AI 비서</title>
</head>
<body>
<main class="shop-main">
<!-- workspace-nav -->
<header class="shop-hero">
<div><h1>쇼핑</h1><p>마음에 드는 상품을 모아 두고 가격과 상품평을 다시 확인하세요.</p></div>
<span class="shop-art" aria-hidden="true">♡</span>
</header>
<form id="shop-chat" class="shop-chat">
<label for="shop-query">챗봇으로 상품 찾기</label>
<div><input id="shop-query" maxlength="500" required placeholder="예: 저소음 키보드 찜해줘"><button class="primary" type="submit">보내기</button></div>
</form>
<section class="shop-recommendations" aria-labelledby="recommendations-title">
<div class="recommendations-header"><h2 id="recommendations-title">추천 상품 비교</h2><p id="recommendation-status" role="status">상품을 물어보면 가격대별 추천을 여기에 보여드려요.</p></div>
<div id="shop-recommendations"></div>
</section>
<section id="saved" class="shop-saved" tabindex="-1" aria-labelledby="saved-title">
<h2 id="saved-title">찜 목록</h2>
<!-- shop-content -->
</section>
</main>
</body>
</html>
