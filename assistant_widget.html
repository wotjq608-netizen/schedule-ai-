<aside class="assistant-widget" aria-label="AI 챗봇">
<button id="assistant-open" type="button" aria-expanded="false" aria-controls="assistant-panel">AI 챗봇</button>
<section id="assistant-panel" hidden>
<header><h2>개인 AI 비서</h2><button id="assistant-close" type="button" aria-label="챗봇 닫기">×</button></header>
<div id="assistant-log" role="log" aria-label="대화" tabindex="0">
<p>“내일 7시에 알람 맞춰 줘”, “부산 내일 날씨랑 옷차림”, “저소음 키보드 찜해줘”처럼 말해 보세요. 연결된 Gemini가 문장 뜻을 분석합니다.</p>
</div>
<form id="assistant-form">
<input id="assistant-input" aria-label="챗봇에게 보낼 문장" placeholder="문장을 입력하세요" maxlength="500" autocomplete="off" required>
<button id="assistant-mic" type="button" aria-label="음성 입력">🎙</button>
<button id="assistant-send" type="submit">보내기</button>
</form>
<p id="assistant-status" role="status"></p>
</section>
</aside>
