<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정 관리 · 개인 AI 비서</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f0;color:#192b25;font:16px system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:clamp(16px,5vw,54px)}h1{margin:0;font-size:clamp(30px,6vw,48px)}h2{font-size:20px;margin:0 0 16px}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}section{background:white;border:1px solid #d9e4dc;border-radius:18px;padding:clamp(12px,3vw,24px);min-width:0}.brief{margin:12px 0 24px;color:#415b50}button,textarea{font:inherit;border:1px solid #a9bfb1;border-radius:8px;padding:8px;color:inherit;background:#fff}button{cursor:pointer}button:hover{background:#e3f0e9}textarea{display:block;width:100%;min-height:95px;margin:8px 0;resize:vertical}.primary{background:#1d573e;color:white}.primary:hover{background:#14432f}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.grid button{padding:5px 0;min-height:46px}.grid button[aria-pressed=true]{background:#d1e8d9;border-color:#327553}.grid small{display:block;font-size:11px}ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e4ebe6}li label{flex:1;overflow-wrap:anywhere}li small{color:#486358}p{overflow-wrap:anywhere}summary{cursor:pointer;margin:16px 0 8px}button:focus-visible,textarea:focus-visible{outline:3px solid #327553;outline-offset:2px}@media(max-width:740px){.layout{grid-template-columns:1fr}}
.transcript{display:grid;gap:14px;max-height:28rem;overflow:auto;overscroll-behavior:contain;margin-bottom:16px}
.turn{display:grid;gap:8px}
.bubble{margin:0;padding:10px 12px;border-radius:12px;white-space:pre-wrap}
.user{background:#e2efe7;justify-self:end;max-width:90%}
.assistant{background:#f3f6f3}
.speaker{display:block;margin-bottom:4px;font-size:12px;font-weight:700;color:#415b50}
.saved{margin:2px 0}
.saved li{display:block;border:0;padding:2px 0}
.saved button{width:100%;text-align:left;overflow-wrap:anywhere}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.examples button{font-size:13px}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.engine,.progress{font-size:13px;color:#415b50}
.grid button[aria-current=date]{font-weight:700;text-decoration:underline}
.calendar-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.calendar-actions h3{margin:0}
textarea[readonly],button:disabled{opacity:.7}

.workspace-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 24px}
.workspace-nav a,.workspace-nav button{display:inline-block;border:1px solid #d9e4dc;border-radius:9px;padding:7px 10px;background:#fff;color:#1d573e;text-decoration:none;font:inherit;cursor:pointer}
.workspace-nav a[aria-current=page]{background:#1d573e;color:#fff;border-color:#1d573e}
.workspace-nav form{margin-left:auto}

.weather-card{margin:18px 0}.weather-card .brief{margin:0 0 10px}.palettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.palette{padding:12px;background:#f3f6f3;border-radius:10px}.palette h3{margin:0 0 8px;font-size:1rem}
.swatches{display:flex;flex-wrap:wrap;gap:8px 16px}.shade{display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.chip{display:inline-block;width:19px;height:19px;border-radius:50%;border:1px solid #5e6b63}
@media(max-width:640px){.palettes{grid-template-columns:1fr}}
</style>
<main>
<!-- workspace-nav -->
<header class="page-header"><h1>일정 관리</h1></header>
<section class="weather-card" aria-labelledby="weather-heading">
<div class="weather-toolbar">
<h2 id="weather-heading">날씨와 착장 색 조합</h2>
<div class="weather-region-control"><label for="weather-region">지역</label><select id="weather-region">
<option value="">기본 지역</option><!-- weather-regions -->
<option value="other">다른 지역…</option>
</select></div>
</div>
<form id="weather-custom" hidden>
<label for="weather-city">시·군 이름</label>
<input id="weather-city" maxlength="60" required>
<button type="submit">조회</button>
</form>
<p class="brief" id="weather" role="status">날씨를 불러오는 중입니다.</p>
<div id="palettes" class="palettes"></div>
</section>
<div class="layout">
<section><h2>AI와 일정 정리</h2>
<p class="engine">AI 비서가 답변합니다. API를 사용할 수 없을 때 서버 설정에 따라 Codex CLI로 답변할 수 있습니다.</p>
<div id="transcript" class="transcript" role="log" aria-label="현재 탭의 대화"></div>
<div class="examples" aria-label="입력 예시">
<button type="button" data-example="할 일이 너무 많아서 어디서부터 시작할지 막막해.">고민 예시</button>
<button type="button" data-example="내일 아침 일정은 산책이고 점심에 친구랑 밥 약속이 있어.">복수 일정 예시</button>
</div>
<form id="chat"><label for="message">고민이나 정리할 일정을 알려주세요.</label><textarea id="message" required maxlength="2000" placeholder="아침 일정은 산책이고 점심에 친구랑 밥 약속"></textarea><button class="primary" id="send">보내기</button></form>
<p id="reply" role="status"></p></section>
<section><h2>일정</h2>
<div class="month"><button id="previous" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div>
<div id="calendar" class="grid"></div>
<div class="calendar-actions"><h3 id="selected" tabindex="-1"></h3><button id="goto-today" disabled>오늘</button></div>
<p id="progress" class="progress"></p><ul id="tasks"></ul>
<details id="carry"><summary>지난 미완료 일정 이월</summary><ul id="overdue"></ul><button id="move">선택한 날짜로 옮기기</button></details>
<p id="status" role="status"></p></section>
</div></main>
<script>
const el = id => document.getElementById(id);
const format = (year, month, day) => [year, ...[month, day].map(n => String(n).padStart(2, "0"))].join("-");
let today, selected, page, items = [];
const history = [];
async function api(path, method = "GET", data) {
  const options = {method};
  if (data !== undefined) {
    options.headers = {"Content-Type": "application/json"};
    options.body = JSON.stringify(data);
  }
  const response = await fetch("/api/" + path, options);
  if (!response.ok) {
    const messages = {401: "로그인이 필요합니다.", 429: "AI가 다른 요청을 처리 중입니다. 잠시 후 다시 시도하세요.", 503: "Google Drive에 저장하거나 읽은 결과를 확인할 수 없습니다. 일정을 새로고침해 확인하세요."};
    const error = await response.json().catch(() => ({}));
    throw new Error(messages[response.status] || (typeof error.detail === "string" ? error.detail : "요청을 처리하지 못했습니다."));
  }
  return response.status === 204 ? null : response.json();
}
async function refresh() {
  const result = await api("tasks");
  today = result.today;
  items = result.tasks;
  if (!selected) {
    setDate(today);
    el("goto-today").disabled = false;
  }
  render();
}
function node(tag, text) {
  const element = document.createElement(tag);
  element.textContent = text;
  return element;
}
async function change(action) {
  try {
    await action();
    await refresh();
    el("status").textContent = "";
  } catch (error) {
    el("status").textContent = error.message;
  }
}
function setDate(date) {
  selected = date;
  const [year, month] = date.split("-").map(Number);
  page = new Date(year, month - 1, 1);
}
function render() {
  const y = page.getFullYear(), m = page.getMonth();
  el("month").textContent = y + "년 " + (m + 1) + "월";
  const calendar = el("calendar");
  calendar.replaceChildren(...[..."일월화수목금토"].map(day => node("small", day)));
  for (let i = 0; i < page.getDay(); i++) calendar.append(node("span", ""));
  const counts = new Map();
  items.forEach(item => counts.set(item.day, (counts.get(item.day) || 0) + 1));
  for (let day = 1; day <= new Date(y, m + 1, 0).getDate(); day++) {
    const key = format(y, m + 1, day), button = node("button", day);
    const count = counts.get(key);
    if (count) button.append(node("small", count + "건"));
    button.setAttribute("aria-pressed", String(key === selected));
    if (key === today) button.setAttribute("aria-current", "date");
    button.onclick = () => {
      selected = key;
      render();
      el("calendar").querySelector('[aria-pressed="true"]').focus();
    };
    calendar.append(button);
  }
  el("selected").textContent = selected;
  const list = el("tasks");
  list.replaceChildren();
  const selectedItems = items.filter(item => item.day === selected);
  const completed = selectedItems.filter(item => item.done).length;
  el("progress").textContent = selectedItems.length ? completed + "건 완료 / 전체 " + selectedItems.length + "건" : "";
  for (const item of selectedItems) {
    const row = node("li", ""), label = node("label", ""), check = document.createElement("input");
    check.type = "checkbox";
    check.checked = Boolean(item.done);
    check.onchange = async () => {
      check.disabled = true;
      try {
        await api("tasks/" + item.id, "PATCH", {done: check.checked});
        await refresh();
        el("status").textContent = "";
      } catch (error) {
        check.checked = Boolean(item.done);
        el("status").textContent = error.message;
      } finally {check.disabled = false;}
    };
    label.append(check, " " + [item.time, item.title].filter(Boolean).join(" "));
    const remove = node("button", "삭제");
    remove.onclick = () => change(() => api("tasks/" + item.id, "DELETE"));
    row.append(label, node("small", item.category), remove);
    list.append(row);
  }
  if (!list.children.length) list.append(node("li", "저장된 일정이 없습니다."));
  const past = items.filter(item => !item.done && item.day < today);
  el("carry").hidden = !past.length;
  el("overdue").replaceChildren(...past.map(item => {
    const row = node("li", ""), label = node("label", ""), check = document.createElement("input");
    check.type = "checkbox";
    check.value = item.id;
    label.append(check, " " + item.day + " " + item.title);
    row.append(label);
    return row;
  }));
  el("move").disabled = selected < today;
}
el("goto-today").onclick = () => {setDate(today); render();};
el("previous").onclick = () => {page.setMonth(page.getMonth() - 1); render();};
el("next").onclick = () => {page.setMonth(page.getMonth() + 1); render();};
el("move").onclick = () => {
  const ids = [...el("overdue").querySelectorAll(":checked")].map(input => Number(input.value));
  if (!ids.length) {el("status").textContent = "옮길 일정을 선택하세요."; return;}
  change(() => api("tasks/carry", "POST", {ids, day: selected}));
};
function bubble(label, message, className) {
  const element = node("p", "");
  element.className = "bubble " + className;
  const speaker = node("span", label);
  speaker.className = "speaker";
  element.append(speaker, message);
  return element;
}
function showTurn(message, result) {
  const turn = node("div", "");
  turn.className = "turn";
  turn.append(bubble("나", message, "user"), bubble("AI 비서", result.reply, "assistant"));
  if (result.engine === "fallback" || result.engine === "codex-cli") {
    const engine = node("small", result.engine === "codex-cli" ? "Codex CLI" : "기본 엔진");
    engine.className = "engine";
    turn.append(engine);
  }
  if (result.tasks.length) {
    turn.append(node("strong", result.tasks.length + "건 저장"));
    const saved = node("ul", "");
    saved.className = "saved";
    for (const task of result.tasks) {
      const button = node("button", [task.day, task.time, task.title, task.category].filter(Boolean).join(" · "));
      button.onclick = async () => {
        setDate(task.day);
        try {
          await refresh();
          el("status").textContent = "";
          el("selected").focus();
        } catch (error) {
          el("status").textContent = error.message;
        }
      };
      const row = node("li", "");
      row.append(button);
      saved.append(row);
    }
    turn.append(saved);
  }
  const transcript = el("transcript");
  transcript.append(turn);
  transcript.scrollTop = transcript.scrollHeight;
}
const examples = [...document.querySelectorAll("[data-example]")];
for (const example of examples) {
  example.onclick = () => {
    el("message").value = example.dataset.example;
    el("message").focus();
  };
}
function lockInput(locked) {
  el("send").disabled = locked;
  el("message").readOnly = locked;
  for (const example of examples) example.disabled = locked;
}
el("chat").onsubmit = async event => {
  event.preventDefault();
  const message = el("message").value.trim();
  if (!message || el("send").disabled) return;
  lockInput(true);
  el("reply").textContent = "일정을 정리하는 중입니다.";
  try {
    const result = await api("chat", "POST", {message, history});
    history.push({message, reply: result.reply});
    if (history.length > 4) history.shift();
    showTurn(message, result);
    el("reply").textContent = result.tasks.length ? "" : "새로 저장한 일정이 없습니다.";
    el("message").value = "";
    await refresh().catch(error => {el("status").textContent = error.message;});
  } catch (error) {el("reply").textContent = error.message;}
  finally {lockInput(false);}
};
refresh().catch(error => {el("status").textContent = error.message;});
const palettes = {
  cold: [
    [["연회색", "#c7c9cf"], ["차콜", "#343943"], ["먹색", "#23252d"]],
    [["아이보리", "#f4eedf"], ["네이비", "#253655"], ["버건디", "#743343"]]
  ],
  mild: [
    [["크림", "#f2e5ce"], ["카멜", "#aa7951"], ["다크 브라운", "#52392f"]],
    [["화이트", "#faf9f6"], ["올리브", "#626747"], ["브라운", "#79503c"]]
  ],
  warm: [
    [["하늘색", "#c1def1"], ["블루 그레이", "#6b8aa3"], ["네이비", "#243657"]],
    [["크림", "#f5ecd9"], ["연청", "#8aadc8"], ["테라코타", "#aa5541"]]
  ]
};
function showPalettes(temperature, wet) {
  const season = temperature === null ? "mild" : temperature < 10 ? "cold" : temperature < 20 ? "mild" : "warm";
  palettes[season].forEach((colors, index) => {
    const card = document.createElement("article");
    card.className = "palette";
    const title = document.createElement("h3");
    title.textContent = index === 0 ? "톤온톤" : "3색 조합";
    const row = document.createElement("div");
    row.className = "swatches";
    colors.forEach(([color, hex], position) => {
      const label = document.createElement("span");
      label.className = "shade";
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.backgroundColor = hex;
      chip.setAttribute("aria-hidden", "true");
      const slots = ["상의", "하의", wet ? "방수 신발·우산" : "신발·소품"];
      label.append(chip, slots[position] + " " + color);
      row.append(label);
    });
    card.append(title, row);
    el("palettes").append(card);
  });
}
const regionSelect = el("weather-region");
const weatherCustom = el("weather-custom");
const cityInput = el("weather-city");
const weatherPref = "assistant-weather:" + document.querySelector(".assistant-widget").dataset.scope;
let weatherSequence = 0;

function preferredCity() {
  try { return localStorage.getItem(weatherPref) || ""; } catch { return ""; }
}

async function updateWeather(city) {
  const sequence = ++weatherSequence;
  el("palettes").replaceChildren();
  el("weather").textContent = "선택한 지역의 날씨를 불러오는 중입니다.";
  try {
    const weather = await api("weather?" + new URLSearchParams({city}));
    if (sequence !== weatherSequence) return;
    try { localStorage.setItem(weatherPref, city); } catch {}
    const wet = weather.precipitation > 0 || weather.rain > 0 || weather.probability >= 45;
    const chance = weather.probability == null ? "" : " · 오늘 최대 강수확률 " + weather.probability + "%";
    const rain = weather.precipitation != null ? " · 현재 강수량 " + weather.precipitation + " mm"
      : weather.rain != null ? " · 남은 시간 예상 비 " + weather.rain + " mm" : " · 강수량 정보 없음";
    const mode = weather.source === "MET Norway" ? " (현재 시각 예보)" : "";
    el("weather").textContent = weather.region + " " + weather.temperature + "°C" + mode + rain + chance +
      (weather.stale ? " · 최근 저장된 날씨" : "") + (weather.source ? " · " + weather.source : "");
    showPalettes(weather.temperature, wet);
  } catch (error) {
    if (sequence !== weatherSequence) return;
    el("weather").textContent = error.message || "선택한 지역의 날씨를 불러오지 못했습니다.";
  }
}
const previousCity = preferredCity();
if (previousCity && ![...regionSelect.options].some(option => option.value === previousCity)) {
  regionSelect.value = "other";
  cityInput.value = previousCity;
  weatherCustom.hidden = false;
} else {
  regionSelect.value = previousCity;
}
regionSelect.addEventListener("change", () => {
  const custom = regionSelect.value === "other";
  weatherCustom.hidden = !custom;
  if (custom) cityInput.focus();
  else updateWeather(regionSelect.value);
});
weatherCustom.addEventListener("submit", event => {
  event.preventDefault();
  const city = cityInput.value.trim();
  if (city) updateWeather(city);
});
updateWeather(previousCity);
</script>
</html>
