<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 개인 AI 비서</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 70% 15%,#e7e5ff,transparent 55%),#f4f6fc;color:#1c2540;font:16px system-ui,sans-serif}
main{width:min(100%,420px);background:white;border:1px solid #e0e5f1;border-radius:26px;box-shadow:0 18px 55px #24205219;padding:clamp(20px,6vw,36px)}h1{margin:0;font-size:34px;letter-spacing:-.055em}p{line-height:1.55;margin:12px 0 22px;color:#536079}
.action{display:block;padding:14px 18px;text-align:center;border-radius:10px;background:#fee500;color:#191919;font-weight:700;text-decoration:none}
.action:hover{background:#f3dc08}.action:focus-visible{outline:3px solid #327553;outline-offset:3px}#notice:empty{display:none}small{display:block;margin-top:18px;color:#536079}
</style>
</head>
<body>
<main>
<h1>개인 AI 비서</h1>
<p>로그인하고 일정과 회의·발표 자료를 정리하세요.</p>
<p id="notice" role="alert"><!-- login-notice --></p>
<!-- login-action -->
<small>일정은 계정별로 저장됩니다. 로그인 시각·계정 식별자와 확인 가능한 접속 IP가 기록됩니다.</small>
<small><a href="/admin">관리자 모드</a></small>
</main>
</body>
</html>
